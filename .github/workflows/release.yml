name: Release

# Pushing a tag such as v1.2.0 tests the extension, packages it, and attaches the .vsix to a GitHub release. It is published to
# the Visual Studio Marketplace and to Open VSX only when the VSCE_PAT / OVSX_PAT secrets exist.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  BETTER_PROFILES_HEADLESS: 1
  # a release is held to the strict budgets (over a budget fails), with room for a shared runner
  BP_PERF_MODE: strict
  BP_PERF_SCALE: 3

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64 libxss1 libxkbfile1 libsecret-1-0
      - run: npm ci
      - name: The tag must be the version of the extension
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag is ${GITHUB_REF_NAME} but package.json says ${version}." >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:perf
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" npm test
      - run: npm run package:vsix -- --out better-profiles.vsix
      - name: End-to-end tests of the file that will be released
        run: |
          npm run test:e2e:headless
          npm run test:e2e:perf:headless
        env:
          BETTER_PROFILES_VSIX: ${{ github.workspace }}/better-profiles.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: better-profiles-vsix
          path: better-profiles.vsix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: |
            perf-results/
            e2e-artifacts/
          if-no-files-found: ignore

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: better-profiles-vsix
          path: dist-vsix
      - name: GitHub release
        run: gh release create "${GITHUB_REF_NAME}" dist-vsix/better-profiles.vsix --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: better-profiles-vsix
          path: dist-vsix
      - name: Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --packagePath dist-vsix/better-profiles.vsix --pat "${VSCE_PAT}"
      - name: Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish dist-vsix/better-profiles.vsix --pat "${OVSX_PAT}"
