name: Nightly

# Everything that needs the network or a VS Code that has not been released yet, so that it cannot hold up a pull request.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  BETTER_PROFILES_HEADLESS: 1
  BP_PERF_SCALE: 2

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, insiders]
    name: end-to-end with the Marketplace (${{ matrix.vscode }})
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
      # one end-to-end test installs an extension from the Marketplace through a drop
      BP_E2E_NETWORK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64 libxss1 libxkbfile1 libsecret-1-0
      - run: npm ci
      - run: npm run test:e2e:headless
      - run: npm run test:e2e:perf:headless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ matrix.vscode }}
          path: |
            perf-results/
            e2e-artifacts/
          if-no-files-found: ignore

  integration-insiders:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VSCODE_VERSION: insiders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64 libxss1 libxkbfile1 libsecret-1-0
      - run: npm ci
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" npm test
